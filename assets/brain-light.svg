<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="How I build: one brain, many agents. A central AI brain (orchestrator) routes every lead, call and task to the right agent (lead-qualifier, voice-receptionist, appointment-setter, support-chatbot, follow-up-agent, GHL workflows), then syncs the results back into GoHighLevel.">
<title>One brain. Many agents.</title>
<defs><style>.fi{opacity:0;animation:fi .7s ease-out forwards}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:4 8;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}
.pr{transform-origin:860px 190px;animation:pr 2.6s ease-out infinite}@keyframes pr{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.9);opacity:0}}
.orb{transform-origin:860px 190px;animation:orb 6s linear infinite}@keyframes orb{to{transform:rotate(360deg)}}
.orb2{transform-origin:860px 190px;animation:orb 9s linear infinite reverse}
.dot{animation:dot 1.4s ease-in-out infinite}@keyframes dot{50%{opacity:.25}}
.cur{animation:bl 1s step-end infinite}@keyframes bl{50%{opacity:0}}
.nf{animation:nf 3s ease-in-out infinite}@keyframes nf{0%,70%,100%{stroke-opacity:1;stroke-width:1}80%{stroke-opacity:1;stroke-width:2.5}}
</style></defs>
<rect x=".5" y=".5" width="1199" height="379" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<text class="fi" x="60" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="2" fill="#59636e">HOW I BUILD</text><text class="fi" style="animation-delay:.15s" x="60" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#1f2328">One brain.</text><g class="fi" style="animation-delay:.35s"><text x="60" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#0969da">Many agents.</text><rect class="cur" x="374" y="178" width="4" height="40" fill="#0969da"/></g><g class="fi" style="animation-delay:.6s"><text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16.5" fill="#59636e"><tspan x="60" y="262">A central AI brain routes every lead, call and</tspan><tspan x="60" y="286">task to the right agent, then syncs the results</tspan><tspan x="60" y="310">back into GoHighLevel.</tspan></text></g>

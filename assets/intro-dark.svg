<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Hi, I'm Ralph. I'm a full-stack developer from the Philippines building AI agents, GoHighLevel automations and web apps for clients. I build most of it with AI, mostly Claude Code, and ship it in small pieces.">
<title>Hi, I'm Ralph</title>
<defs><style>.fi{opacity:0;animation:fi .7s ease-out forwards}@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wave{transform-origin:94px 120px;animation:wave 2.4s ease-in-out infinite}@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.dot{animation:dot 1.4s ease-in-out infinite}@keyframes dot{50%{opacity:.25}}
.ul{transform-origin:0 0;transform:scaleX(0);animation:ul .8s ease-out forwards}@keyframes ul{to{transform:scaleX(1)}}</style></defs>
<rect x=".5" y=".5" width="1199" height="279" rx="16" fill="#0d1117" stroke="#30363d"/>
<g class="fi"><text x="60" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="2" fill="#8b949e">ABOUT ME</text>
<circle class="dot" cx="160" cy="51" r="4" fill="#3fb950"/><text x="172" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3fb950">open to work</text></g>
<g class="fi" style="animation-delay:.15s"><text x="60" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#e6edf3">Hi, I'm <tspan fill="#58a6ff">Ralph</tspan> <tspan class="wave" style="display:inline-block">👋</tspan></text></g>
<rect class="ul" x="204" y="118" width="96" height="4" rx="2" fill="#58a6ff" style="animation-delay:.8s"/>
<text class="fi" style="animation-delay:.45s" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#e6edf3">
<tspan x="60" y="156">A full-stack developer from the <tspan font-weight="700">Philippines</tspan> building <tspan fill="#58a6ff" font-weight="700">AI agents</tspan>, <tspan fill="#d29922" font-weight="700">GoHighLevel automations</tspan> and <tspan fill="#a371f7" font-weight="700">web apps</tspan> for clients.</tspan>
<tspan x="60" y="186" fill="#8b949e">I build most of it with AI, mostly <tspan fill="#f778ba" font-weight="700">Claude Code</tspan>, and ship it in small pieces.</tspan></text>
<g class="fi" style="animation-delay:1.30s"><rect x="60" y="214" width="117" height="34" rx="17" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".6"/><circle cx="77" cy="231" r="4" fill="#58a6ff"/><text x="88" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#58a6ff">AI Agents</text></g><g class="fi" style="animation-delay:1.45s"><rect x="189.39999999999998" y="214" width="135" height="34" rx="17" fill="#d29922" fill-opacity=".12" stroke="#d29922" stroke-opacity=".6"/><circle cx="206.39999999999998" cy="231" r="4" fill="#d29922"/><text x="217.39999999999998" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#d29922">GoHighLevel</text></g><g class="fi" style="animation-delay:1.60s"><rect x="336.0" y="214" width="212" height="34" rx="17" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".6"/><circle cx="353.0" cy="231" r="4" fill="#3fb950"/><text x="364.0" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#3fb950">Automation Workflows</text></g><g class="fi" style="animation-delay:1.75s"><rect x="560.0" y="214" width="169" height="34" rx="17" fill="#a371f7" fill-opacity=".12" stroke="#a371f7" stroke-opacity=".6"/><circle cx="577.0" cy="231" r="4" fill="#a371f7"/><text x="588.0" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#a371f7">Full-Stack Apps</text></g><g class="fi" style="animation-delay:1.90s"><rect x="741.0" y="214" width="135" height="34" rx="17" fill="#f778ba" fill-opacity=".12" stroke="#f778ba" stroke-opacity=".6"/><circle cx="758.0" cy="231" r="4" fill="#f778ba"/><text x="769.0" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f778ba">Claude Code</text></g>
</svg>
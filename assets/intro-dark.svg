<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="326" viewBox="0 0 1200 326" role="img" aria-label="Hi, I'm Ralph. Software Engineer and BSIT graduate from the Philippines. I build AI agents, GoHighLevel automations and web apps with clean, scalable structure. Mostly built with Claude Code, shipped in small pieces.">
<title>Hi, I'm Ralph</title>
<defs><style>.fi{opacity:0;animation:fi .7s ease-out forwards}@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wave{transform-origin:94px 120px;animation:wave 2.4s ease-in-out infinite}@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.dot{animation:dot 1.4s ease-in-out infinite}@keyframes dot{50%{opacity:.25}}
.ul{transform-origin:0 0;transform:scaleX(0);animation:ul .8s ease-out forwards}@keyframes ul{to{transform:scaleX(1)}}</style></defs>
<rect x=".5" y=".5" width="1199" height="325" rx="16" fill="#0d1117" stroke="#30363d"/>
<g class="fi"><text x="60" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="2" fill="#8b949e">ABOUT ME</text>
<circle class="dot" cx="160" cy="51" r="4" fill="#3fb950"/><text x="172" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#3fb950">open to work</text></g>
<g class="fi" style="animation-delay:.15s"><text x="60" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#e6edf3">Hi, I'm <tspan fill="#58a6ff">Ralph</tspan> <tspan class="wave" style="display:inline-block">👋</tspan></text></g>
<rect class="ul" x="204" y="118" width="96" height="4" rx="2" fill="#58a6ff" style="animation-delay:.8s"/>
<text class="fi" style="animation-delay:.45s" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#e6edf3">
<tspan x="60" y="156"><tspan font-weight="700">Software Engineer</tspan> and <tspan font-weight="700">BSIT graduate</tspan> from the Philippines. I build <tspan fill="#58a6ff" font-weight="700">AI agents</tspan>, <tspan fill="#d29922" font-weight="700">GoHighLevel automations</tspan></tspan>
<tspan x="60" y="186">and <tspan fill="#a371f7" font-weight="700">web apps</tspan> with clean, scalable structure. <tspan fill="#8b949e">Mostly built with <tspan fill="#f778ba" font-weight="700">Claude Code</tspan>, shipped in small pieces.</tspan></tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Ralph Benitez. Software Engineer, AI Agents, GoHighLevel Automation. I turn manual business processes into AI-powered systems.">
<title>Ralph Benitez</title>
<defs><style>.fi{opacity:0;animation:fi .7s ease-out forwards}@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tp{to{transform:translateX(440px)}}
.cur{animation:bl 1s step-end infinite}@keyframes bl{50%{opacity:0}}
.on{animation:on 1.6s ease-in-out infinite}@keyframes on{50%{opacity:.3}}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 1.4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.spark{stroke-dasharray:420;stroke-dashoffset:420;animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:420}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
.gl{animation:gl 6s linear infinite}@keyframes gl{from{transform:translateX(-400px)}to{transform:translateX(1300px)}}
.grad{animation:gs 6s ease-in-out infinite alternate}@keyframes gs{to{transform:translateX(-200px)}}
.eq rect{transform-box:fill-box;transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
</style>
<linearGradient id="vg" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="ng" gradientUnits="userSpaceOnUse" x1="50" x2="650"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>

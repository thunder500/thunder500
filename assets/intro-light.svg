<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Hi, I'm Ralph. Software Engineer and BSIT graduate from the Philippines. I build AI agents, GoHighLevel automations and web apps with clean, scalable structure. Mostly built with Claude Code, shipped in small pieces.">
<title>Hi, I'm Ralph</title>
<defs><style>.fi{opacity:0;animation:fi .7s ease-out forwards}@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wave{transform-origin:94px 120px;animation:wave 2.4s ease-in-out infinite}@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.dot{animation:dot 1.4s ease-in-out infinite}@keyframes dot{50%{opacity:.25}}
.ul{transform-origin:0 0;transform:scaleX(0);animation:ul .8s ease-out forwards}@keyframes ul{to{transform:scaleX(1)}}</style></defs>
<rect x=".5" y=".5" width="1199" height="279" rx="16" fill="#ffffff" stroke="#d0d7de"/>
<g class="fi"><text x="60" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="2" fill="#59636e">ABOUT ME</text>
<circle class="dot" cx="160" cy="51" r="4" fill="#1a7f37"/><text x="172" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#1a7f37">open to work</text></g>
<g class="fi" style="animation-delay:.15s"><text x="60" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#1f2328">Hi, I'm <tspan fill="#0969da">Ralph</tspan> <tspan class="wave" style="display:inline-block">👋</tspan></text></g>
<rect class="ul" x="204" y="118" width="96" height="4" rx="2" fill="#0969da" style="animation-delay:.8s"/>
<text class="fi" style="animation-delay:.45s" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#1f2328">
<tspan x="60" y="156"><tspan font-weight="700">Software Engineer</tspan> and <tspan font-weight="700">BSIT graduate</tspan> from the Philippines. I build <tspan fill="#0969da" font-weight="700">AI agents</tspan>, <tspan fill="#9a6700" font-weight="700">GoHighLevel automations</tspan></tspan>
<tspan x="60" y="186">and <tspan fill="#8250df" font-weight="700">web apps</tspan> with clean, scalable structure. <tspan fill="#59636e">Mostly built with <tspan fill="#bf3989" font-weight="700">Claude Code</tspan>, shipped in small pieces.</tspan></tspan></text>
<g class="fi" style="animation-delay:1.30s"><rect x="60" y="214" width="152" height="34" rx="17" fill="#1f2328" fill-opacity=".12" stroke="#1f2328" stroke-opacity=".6"/><circle cx="77" cy="231" r="4" fill="#1f2328"/><text x="88" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1f2328">BSIT Graduate</text></g><g class="fi" style="animation-delay:1.45s"><rect x="223.8" y="214" width="117" height="34" rx="17" fill="#0969da" fill-opacity=".12" stroke="#0969da" stroke-opacity=".6"/><circle cx="240.8" cy="231" r="4" fill="#0969da"/><text x="251.8" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#0969da">AI Agents</text></g><g class="fi" style="animation-delay:1.60s"><rect x="353.2" y="214" width="135" height="34" rx="17" fill="#9a6700" fill-opacity=".12" stroke="#9a6700" stroke-opacity=".6"/><circle cx="370.2" cy="231" r="4" fill="#9a6700"/><text x="381.2" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#9a6700">GoHighLevel</text></g><g class="fi" style="animation-delay:1.75s"><rect x="499.79999999999995" y="214" width="212" height="34" rx="17" fill="#1a7f37" fill-opacity=".12" stroke="#1a7f37" stroke-opacity=".6"/><circle cx="516.8" cy="231" r="4" fill="#1a7f37"/><text x="527.8" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1a7f37">Automation Workflows</text></g><g class="fi" style="animation-delay:1.90s"><rect x="723.8" y="214" width="169" height="34" rx="17" fill="#8250df" fill-opacity=".12" stroke="#8250df" stroke-opacity=".6"/><circle cx="740.8" cy="231" r="4" fill="#8250df"/><text x="751.8" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#8250df">Full-Stack Apps</text></g><g class="fi" style="animation-delay:2.05s"><rect x="904.8" y="214" width="135" height="34" rx="17" fill="#bf3989" fill-opacity=".12" stroke="#bf3989" stroke-opacity=".6"/><circle cx="921.8" cy="231" r="4" fill="#bf3989"/><text x="932.8" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#bf3989">Claude Code</text></g>
</svg>
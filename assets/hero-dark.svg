<linearGradient id="sf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06b6d4" stop-opacity=".25"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="1200" height="400" rx="16"/></clipPath></defs>
